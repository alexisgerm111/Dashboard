<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Directeur Commercial — IA Vocale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #EEF1F6;
            --surface: #FFFFFF;
            --surface-2: #F5F7FA;
            --border: #E2E7EF;
            --border-2: #D0D7E3;
            --blue: #1D4ED8;
            --blue-light: #EFF4FF;
            --blue-mid: #DBEAFE;
            --green: #059669;
            --green-light: #ECFDF5;
            --amber: #D97706;
            --amber-light: #FFFBEB;
            --red: #DC2626;
            --red-light: #FEF2F2;
            --purple: #7C3AED;
            --purple-light: #F5F3FF;
            --text-1: #0F172A;
            --text-2: #334155;
            --text-3: #64748B;
            --text-4: #94A3B8;
            --sidebar-w: 64px;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
            --shadow-md: 0 4px 12px rgba(15,23,42,0.08), 0 2px 4px rgba(15,23,42,0.04);
        }
        html { font-size: 14px; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text-1);
            display: flex;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        /* ── SIDEBAR ────────────────────────────────────── */
        .sidebar {
            width: var(--sidebar-w);
            background: var(--text-1);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 0 18px;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            z-index: 100;
            gap: 4px;
        }
        .sidebar-logo {
            width: 32px; height: 32px;
            background: var(--blue);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 16px;
            flex-shrink: 0;
        }
        .sidebar-logo svg { width: 18px; height: 18px; }
        .sb-icon {
            width: 40px; height: 40px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            color: #94A3B8;
            background: transparent;
            border: none;
            position: relative;
            margin-bottom: 4px;
        }
        .sb-icon:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .sb-icon.active { background: rgba(29,78,216,0.3); color: #60A5FA; }
        .sb-icon svg { width: 18px; height: 18px; }
        .sb-tooltip {
            position: absolute;
            left: 48px;
            background: var(--text-1);
            color: #fff;
            font-size: 10px;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 4px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s;
            z-index: 120;
        }
        .sb-icon:hover .sb-tooltip { opacity: 1; }
        .sidebar-divider { width: 24px; height: 1px; background: rgba(255,255,255,0.08); margin: 6px 0; }
        .sidebar-spacer { flex: 1; }
        .sb-avatar {
            width: 34px; height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3B82F6, #1D4ED8);
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 600; color: #fff;
            cursor: pointer;
        }
        /* ── MAIN ────────────────────────────────────────── */
        .main {
            margin-left: var(--sidebar-w);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            height: 100vh;
        }
        /* ── TOPBAR ──────────────────────────────────────── */
        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 50;
        }
        .topbar-left { display: flex; align-items: center; gap: 12px; }
        .topbar-title { font-size: 14px; font-weight: 600; color: var(--text-1); }
        .topbar-sub { font-size: 11px; color: var(--text-3); margin-top: 1px; }
        .topbar-right { display: flex; align-items: center; gap: 8px; }
        .period-tabs {
            display: flex;
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 2px;
            gap: 2px;
        }
        .period-tab {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-3);
            cursor: pointer;
            border: none;
            background: transparent;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .period-tab.active { background: var(--surface); color: var(--text-1); box-shadow: var(--shadow); }
        .live-pill {
            display: flex; align-items: center; gap: 5px;
            background: var(--green-light);
            border: 1px solid #A7F3D0;
            border-radius: 20px;
            padding: 4px 10px 4px 7px;
            font-size: 11px;
            font-weight: 500;
            color: var(--green);
            cursor: pointer;
            white-space: nowrap;
        }
        .live-dot { width: 7px; height: 7px; background: var(--green); border-radius: 50%; animation: pulse-green 2s infinite; }
        @keyframes pulse-green {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }
        .btn {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 11.5px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .btn-ghost { background: transparent; color: var(--text-2); border: 1px solid var(--border-2); }
        .btn-ghost:hover { background: var(--bg); }
        .btn-primary { background: var(--blue); color: white; }
        .btn-primary:hover { background: #1E40AF; }
        /* ── CONTENT ─────────────────────────────────────── */
        .content {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 12px 20px 12px;
        }
        /* ── TAB NAV ─────────────────────────────────────── */
        .tab-nav {
            display: flex;
            gap: 4px;
            background: var(--surface);
            border-radius: var(--radius-sm);
            padding: 4px;
            box-shadow: var(--shadow);
            flex-shrink: 0;
            width: fit-content;
            margin: 0 auto;
        }
        .tab-btn {
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-3);
            transition: all 0.15s;
        }
        .tab-btn.active { background: var(--blue); color: white; box-shadow: var(--shadow); }
        .tab-content { flex: 1; overflow: hidden; display: none; }
        .tab-content.active { display: flex; flex-direction: column; gap: 12px; }
        /* ── AI FEED ─────────────────────────────────────── */
        .ai-feed {
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 12px 16px;
            box-shadow: var(--shadow);
            flex-shrink: 0;
        }
        .ai-feed-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .ai-feed-label { display: flex; align-items: center; gap: 7px; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); }
        .ai-badge { background: linear-gradient(135deg, #1D4ED8, #7C3AED); color: white; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; letter-spacing: 0.04em; }
        .feed-cards { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .feed-cards::-webkit-scrollbar { display: none; }
        .feed-card {
            flex-shrink: 0;
            width: 300px;
            border-radius: 10px;
            padding: 12px 14px;
            border: 1px solid transparent;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
            transition: box-shadow 0.2s;
        }
        .feed-card:hover { box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        .feed-card.type-opp { background: var(--green-light); border-color: #BBF7D0; }
        .feed-card.type-warn { background: var(--amber-light); border-color: #FDE68A; }
        .feed-card.type-alert { background: var(--red-light); border-color: #FECACA; }
        .feed-card.type-info { background: var(--blue-light); border-color: var(--blue-mid); }
        .feed-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
        .feed-tag.opp { color: var(--green); }
        .feed-tag.warn { color: var(--amber); }
        .feed-tag.alert { color: var(--red); }
        .feed-tag.info { color: var(--blue); }
        .feed-text { font-size: 12px; line-height: 1.5; color: var(--text-2); }
        .feed-text strong { color: var(--text-1); font-weight: 600; }
        .feed-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .feed-btn { font-size: 11px; font-weight: 500; padding: 4px 10px; border-radius: 6px; cursor: pointer; border: none; transition: all 0.15s; }
        .feed-btn.primary-action { background: var(--text-1); color: white; }
        .feed-btn.primary-action:hover { background: var(--blue); }
        .feed-btn.secondary-action { background: rgba(0,0,0,0.06); color: var(--text-2); }
        .feed-btn.secondary-action:hover { background: rgba(0,0,0,0.10); }
        /* ── ROI BLOCK ───────────────────────────────────── */
        .roi-block { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
        .roi-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .roi-card {
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 12px 14px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
            overflow: hidden;
        }
        .roi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
        .roi-card.accent-green::before { background: var(--green); }
        .roi-card.accent-blue::before { background: var(--blue); }
        .roi-card.accent-amber::before { background: var(--amber); }
        .roi-card.accent-purple::before { background: var(--purple); }
        .roi-label { font-size: 10px; font-weight: 500; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; }
        .roi-value { font-size: 22px; font-weight: 700; color: var(--text-1); line-height: 1.1; letter-spacing: -0.02em; }
        .roi-value span.unit { font-size: 14px; font-weight: 600; }
        .roi-delta { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 500; }
        .roi-delta.up { color: var(--green); }
        .roi-delta.neutral { color: var(--amber); }
        .roi-sub { font-size: 10px; color: var(--text-3); line-height: 1.4; }
        .roi-cta { margin-top: 2px; font-size: 11px; font-weight: 500; color: var(--blue); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 3px; background: none; border: none; padding: 0; text-align: left; }
        .roi-cta:hover { text-decoration: underline; }
        /* ── CORRELATION CHART ───────────────────────────── */
        .correlation-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 12px 16px; box-shadow: var(--shadow); flex-shrink: 0; }
        .card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
        .card-title { font-size: 13px; font-weight: 600; color: var(--text-1); }
        .card-sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }
        .chart-legend { display: flex; gap: 12px; align-items: center; }
        .legend-item { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--text-3); }
        .legend-dot { width: 7px; height: 7px; border-radius: 50%; }
        .chart-area { position: relative; height: 110px; }
        .chart-svg { width: 100%; height: 100%; overflow: visible; }
        /* ── GRID LAYOUTS ──────────────────────────────── */
        .grid-2 { display: grid; grid-template-columns: 1fr 380px; gap: 12px; min-height: 0; flex: 1; }
        /* ── TEAM MATRIX ─────────────────────────────────── */
        .team-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
        .team-card-header { padding: 10px 16px 8px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .filter-pills { display: flex; gap: 5px; }
        .filter-pill { padding: 3px 10px; border-radius: 20px; font-size: 10.5px; font-weight: 500; cursor: pointer; border: 1px solid var(--border-2); background: transparent; color: var(--text-3); transition: all 0.15s; }
        .filter-pill.active { background: var(--blue); color: white; border-color: var(--blue); }
        .team-table-wrap { flex: 1; overflow-y: auto; min-height: 0; }
        .team-table { width: 100%; border-collapse: collapse; }
        .team-table thead tr { background: var(--surface-2); position: sticky; top: 0; }
        .team-table th { padding: 8px 12px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); text-align: left; border-bottom: 1px solid var(--border); }
        .team-table th:first-child { padding-left: 16px; }
        .team-table tbody tr { border-bottom: 1px solid var(--border); transition: background 0.12s; cursor: pointer; }
        .team-table tbody tr:hover { background: var(--surface-2); }
        .team-table tbody tr:last-child { border-bottom: none; }
        .team-table td { padding: 8px 12px; vertical-align: middle; font-size: 12px; }
        .team-table td:first-child { padding-left: 16px; }
        .rep-info { display: flex; align-items: center; gap: 8px; }
        .rep-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }
        .rep-name { font-size: 12px; font-weight: 500; color: var(--text-1); }
        .rep-role { font-size: 10px; color: var(--text-3); margin-top: 1px; }
        .circle-wrap { display: flex; align-items: center; gap: 8px; }
        .circ-svg { width: 30px; height: 30px; transform: rotate(-90deg); flex-shrink: 0; }
        .circ-bg { fill: none; stroke: var(--border); stroke-width: 3; }
        .circ-fill { fill: none; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .circ-fill.green { stroke: var(--green); }
        .circ-fill.blue { stroke: var(--blue); }
        .circ-fill.amber { stroke: var(--amber); }
        .circ-fill.red { stroke: var(--red); }
        .circ-label { font-size: 11px; font-weight: 600; color: var(--text-1); }
        .bar-mini { width: 100%; max-width: 70px; height: 4px; background: var(--border); border-radius: 3px; overflow: hidden; }
        .bar-mini-fill { height: 100%; border-radius: 3px; transition: width 1s ease; }
        .bar-mini-fill.blue { background: var(--blue); }
        .bar-mini-fill.green { background: var(--green); }
        .bar-mini-fill.amber { background: var(--amber); }
        .mini-stat { font-size: 11px; font-weight: 500; color: var(--text-2); margin-top: 3px; }
        .status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 6px; border-radius: 20px; font-size: 10px; font-weight: 500; }
        .status-badge .dot { width: 4px; height: 4px; border-radius: 50%; }
        .badge-green { background: var(--green-light); color: var(--green); }
        .badge-green .dot { background: var(--green); }
        .badge-amber { background: var(--amber-light); color: var(--amber); }
        .badge-amber .dot { background: var(--amber); }
        .badge-red { background: var(--red-light); color: var(--red); }
        .badge-red .dot { background: var(--red); }
        .badge-purple { background: var(--purple-light); color: var(--purple); }
        .badge-purple .dot { background: var(--purple); }
        .action-link { font-size: 11px; font-weight: 500; color: var(--blue); cursor: pointer; background: none; border: none; padding: 0; display: inline-flex; align-items: center; gap: 3px; }
        .action-link:hover { text-decoration: underline; }
        /* ── RADAR ───────────────────────────────────────── */
        .radar-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 12px 14px; display: flex; flex-direction: column; }
        .radar-filters { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
        .radar-filter { padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 500; cursor: pointer; border: 1px solid var(--border-2); background: transparent; color: var(--text-3); transition: all 0.12s; }
        .radar-filter.active { background: var(--blue); color: white; border-color: var(--blue); }
        .radar-svg-wrap { display: flex; justify-content: center; margin: 8px 0 6px; flex: 1; min-height: 0; }
        .radar-legend { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .radar-leg-item { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--text-3); }
        .radar-leg-line { width: 14px; height: 2.5px; border-radius: 2px; }
        /* ── RECRUITMENT ─────────────────────────────────── */
        .recruit-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; flex-shrink: 0; }
        .recruit-stat { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; }
        .recruit-stat-num { font-size: 20px; font-weight: 700; color: var(--text-1); letter-spacing: -0.02em; }
        .recruit-stat-label { font-size: 11px; color: var(--text-3); }
        .recruit-stat-impact { font-size: 10.5px; color: var(--green); font-weight: 500; margin-top: 3px; }
        .funnel-row { display: flex; flex-direction: column; gap: 5px; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 12px 16px; flex-shrink: 0; }
        .funnel-step { display: flex; align-items: center; gap: 10px; }
        .funnel-label { font-size: 11px; color: var(--text-2); width: 180px; flex-shrink: 0; }
        .funnel-bar-bg { flex: 1; height: 6px; background: var(--bg); border-radius: 4px; overflow: hidden; }
        .funnel-bar-fill { height: 100%; border-radius: 4px; transition: width 1s ease; }
        .funnel-num { font-size: 11.5px; font-weight: 600; color: var(--text-1); width: 30px; text-align: right; }
        .funnel-pct { font-size: 10px; color: var(--text-3); width: 38px; }
        .ats-table-wrap { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; flex: 1; min-height: 0; }
        .ats-table { width: 100%; border-collapse: collapse; }
        .ats-table th { padding: 8px 12px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); text-align: left; background: var(--surface-2); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 2; }
        .ats-table th:first-child { padding-left: 16px; }
        .ats-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 11.5px; }
        .ats-table td:first-child { padding-left: 16px; }
        .ats-table tbody tr:last-child td { border-bottom: none; }
        .ats-table tbody tr:hover { background: var(--surface-2); }
        .score-pill { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
        .score-high { background: var(--green-light); color: var(--green); }
        .score-mid { background: var(--amber-light); color: var(--amber); }
        .score-low { background: var(--red-light); color: var(--red); }
        .replay-btn { display: inline-flex; align-items: center; gap: 5px; background: var(--surface-2); border: 1px solid var(--border-2); border-radius: 6px; padding: 4px 8px; font-size: 11px; font-weight: 500; color: var(--text-2); cursor: pointer; transition: all 0.15s; }
        .replay-btn:hover { background: var(--blue); color: white; border-color: var(--blue); }
        .play-icon { width: 11px; height: 11px; }
        /* ── COACHING ────────────────────────────────────── */
        .coaching-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
        .debrief-item { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
        .debrief-item:last-child { border-bottom: none; }
        .debrief-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
        .debrief-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .debrief-title { font-size: 13px; font-weight: 600; color: var(--text-1); }
        .deal-amount { font-size: 11px; font-weight: 600; background: var(--blue-light); color: var(--blue); padding: 2px 8px; border-radius: 5px; }
        .ai-badges { display: flex; gap: 4px; flex-wrap: wrap; }
        .ai-badge-item { font-size: 10px; font-weight: 500; padding: 2px 6px; border-radius: 5px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
        .debrief-quant { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; background: var(--surface-2); border-radius: 6px; padding: 8px 10px; }
        .dq-item { display: flex; flex-direction: column; gap: 2px; }
        .dq-num { font-size: 15px; font-weight: 700; color: var(--text-1); }
        .dq-label { font-size: 9.5px; color: var(--text-3); }
        .debrief-qual { font-size: 11.5px; line-height: 1.5; color: var(--text-2); padding: 10px 12px; background: linear-gradient(135deg, #F0F4FF, #F5F3FF); border-radius: 6px; border-left: 3px solid var(--blue); }
        .debrief-qual strong { color: var(--text-1); font-weight: 600; }
        .debrief-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        /* ── SECTION HEADERS ─────────────────────────────── */
        .section-header { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .section-title { font-size: 12px; font-weight: 600; color: var(--text-1); display: flex; align-items: center; gap: 6px; }
        .section-icon { width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
        /* ── MODAL ───────────────────────────────────────── */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center;
            z-index: 200;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            width: 600px;
            max-width: 90%;
            padding: 20px;
            display: flex; flex-direction: column; gap: 14px;
        }
        .modal-header { display: flex; align-items: center; justify-content: space-between; }
        .modal-title { font-size: 16px; font-weight: 600; }
        .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-3); }
        .modal-body { display: flex; flex-direction: column; gap: 10px; }
        .modal-row { display: flex; gap: 20px; }
        .modal-col { flex: 1; display: flex; flex-direction: column; gap: 6px; }
        .modal-label { font-size: 10px; font-weight: 600; text-transform: uppercase; color: var(--text-3); }
        .modal-value { font-size: 14px; font-weight: 500; color: var(--text-1); }
        /* ── TOAST ───────────────────────────────────────── */
        .toast {
            background: var(--text-1);
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 12px;
            box-shadow: var(--shadow-md);
            animation: fadeInUp 0.3s ease;
            pointer-events: none;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

                        <td style="font-size:11px;">${c.role}</td>
                        <td><span class="score-pill score-${c.qcm > 85 ? 'high' : c.qcm > 60 ? 'mid' : 'low'}">${c.qcm}%</span></td>
                        <td style="font-size:11px;">${c.fit}</td>
                        <td><span class="score-pill score-${c.sim > 85 ? 'high' : c.sim > 60 ? 'mid' : 'low'}">${c.sim}%</span></td>
                        <td><div class="circle-wrap"><svg class="circ-svg" viewBox="0 0 40 40" style="width:26px;height:26px;"><circle class="circ-bg" cx="20" cy="20" r="15.9"/><circle class="circ-fill ${c.align > 85 ? 'green' : c.align > 60 ? 'amber' : 'red'}" cx="20" cy="20" r="15.9" style="stroke-dashoffset: ${100 - c.align};"/></svg><span style="font-size:11px; font-weight:600;">${c.align}%</span></div></td>
                        <td><button class="replay-btn" data-replay="${c.replay}"><svg class="play-icon" viewBox="0 0 12 12" fill="currentColor"><path d="M3 2.5l7 3.5-7 3.5V2.5z"/></svg>${c.replay}</button></td>
                        <td><span class="status-badge badge-${c.recColor}"><span class="dot"></span>${c.rec}</span></td>
                    </tr>
                `).join('');
                let html = `
                    <div class="tab-nav" style="margin:0 auto;">
                        <button class="tab-btn" data-view="overview">Vue d'ensemble</button>
                        <button class="tab-btn" data-view="team">Équipe</button>
                        <button class="tab-btn active" data-view="recruitment">Recrutement</button>
                        <button class="tab-btn" data-view="coaching">Coaching</button>
                    </div>
                    <div class="section-header">
                        <div class="section-title">
                            <div class="section-icon" style="background:#FFFBEB;"><svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M7 1.5L8.3 5.2H12.2L9 7.4L10.1 11.1L7 8.9L3.9 11.1L5 7.4L1.8 5.2H5.7L7 1.5Z" stroke="#D97706" stroke-width="1.3" fill="none"/></svg></div>
                            Pipeline de recrutement — ${periodData.label}
                        </div>
                    </div>
                    <div class="recruit-row">
                        <div class="recruit-stat">
                            <div class="recruit-stat-num">${periodData.recruitStats.received}</div>
                            <div class="recruit-stat-label">Candidatures reçues</div>
                        </div>
                        <div class="recruit-stat">
                            <div class="recruit-stat-num" style="color:var(--blue);">${periodData.recruitStats.evaluated}</div>
                            <div class="recruit-stat-label">Évaluées automatiquement (QCM + simulation)</div>
                            <div class="recruit-stat-impact">↳ 0 heure mobilisée avant la décision finale</div>
                        </div>
                        <div class="recruit-stat">
                            <div class="recruit-stat-num" style="color:var(--green);">${periodData.recruitStats.qualified}</div>
                            <div class="recruit-stat-label">Profils qualifiés · prêts à rencontrer</div>
                            <div class="recruit-stat-impact">Taux de filtrage automatique : ${Math.round(100 - (periodData.recruitStats.qualified / periodData.recruitStats.received * 100))}%</div>
                        </div>
                    </div>
                    <div class="funnel-row">
                        <div class="funnel-step">
                            <div class="funnel-label">Candidatures reçues</div>
                            <div class="funnel-bar-bg"><div class="funnel-bar-fill" style="width:100%; background:#1D4ED8;"></div></div>
                            <div class="funnel-num">${periodData.recruitStats.received}</div>
                        </div>
                        <div class="funnel-step">
                            <div class="funnel-label">Simulation complétée</div>
                            <div class="funnel-bar-bg"><div class="funnel-bar-fill" style="width:${(periodData.recruitStats.evaluated / periodData.recruitStats.received * 100)}%; background:#3B82F6;"></div></div>
                            <div class="funnel-num">${periodData.recruitStats.evaluated}</div>
                        </div>
                        <div class="funnel-step">
                            <div class="funnel-label">Seuil de qualification atteint</div>
                            <div class="funnel-bar-bg"><div class="funnel-bar-fill" style="width:${(periodData.recruitStats.qualified / periodData.recruitStats.received * 100)}%; background:#059669;"></div></div>
                            <div class="funnel-num">${periodData.recruitStats.qualified}</div>
                        </div>
                        <div class="funnel-step">
                            <div class="funnel-label">Entretien humain planifié</div>
                            <div class="funnel-bar-bg"><div class="funnel-bar-fill" style="width:13%; background:#D97706;"></div></div>
                            <div class="funnel-num">2</div>
                        </div>
                    </div>
                    <div class="ats-table-wrap">
                        <table class="ats-table">
                            <thead>
                                <tr>
                                    <th>Candidat</th>
                                    <th>Poste</th>
                                    <th>QCM</th>
                                    <th>Fit comportemental</th>
                                    <th>Simulateur vocal</th>
                                    <th>Alignement Top Perf.</th>
                                    <th>Replay moment critique</th>
                                    <th>Recommandation IA</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                `;
                mainContent.innerHTML = html;
                attachTabEvents();
                attachDataToastEvents();
                attachReplayEvents();
            }

            // ─── COACHING ───────────────────────────────────
            function renderCoaching() {
                const periodData = periods[state.period];
                const debriefs = periodData.debriefs;
                let html = `
                    <div class="tab-nav" style="margin:0 auto;">
                        <button class="tab-btn" data-view="overview">Vue d'ensemble</button>
                        <button class="tab-btn" data-view="team">Équipe</button>
                        <button class="tab-btn" data-view="recruitment">Recrutement</button>
                        <button class="tab-btn active" data-view="coaching">Coaching</button>
                    </div>
                    <div class="section-header">
                        <div class="section-title">
                            <div class="section-icon" style="background:#F5F3FF;"><svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M7 1.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z" stroke="#7C3AED" stroke-width="1.4"/><path d="M4.5 9.5C4.5 9.5 5.5 7 7 7s2.5 2.5 2.5 2.5" stroke="#7C3AED" stroke-width="1.4" stroke-linecap="round"/><circle cx="5.5" cy="5.5" r="0.7" fill="#7C3AED"/><circle cx="8.5" cy="5.5" r="0.7" fill="#7C3AED"/></svg></div>
                            Cockpit coaching — Autopsies des appels réels
                        </div>
                        <button class="btn btn-ghost" style="font-size:11px; padding:4px 10px;" data-toast="Tous les débriefs affichés.">Voir tous les débriefs</button>
                    </div>
                    <div class="coaching-card">
                `;
                debriefs.forEach((d, index) => {
                    html += `
                        <div class="debrief-item">
                            <div class="debrief-top">
                                <div>
                                    <div class="debrief-meta">
                                        <div class="debrief-title">${d.title}</div>
                                        <span class="deal-amount">${d.amount}</span>
                                        <span class="status-badge badge-${d.statusColor}" style="font-size:10px;"><span class="dot"></span>${d.status}</span>
                                    </div>
                                    <div style="font-size:10.5px; color:var(--text-3); margin-top:3px;">${d.date}</div>
                                </div>
                                <div class="ai-badges">
                                    ${d.badges.map(b => `<span class="ai-badge-item">${b}</span>`).join('')}
                                </div>
                            </div>
                            <div class="debrief-quant">
                                <div class="dq-item"><div class="dq-num" style="color:${d.quant.parole > 50 ? 'var(--blue)' : 'var(--red)'};">${d.quant.parole}%</div><div class="dq-label">Temps de parole prospect</div></div>
                                <div class="dq-item"><div class="dq-num">${d.quant.questions}</div><div class="dq-label">Questions d'impact posées</div></div>
                                <div class="dq-item"><div class="dq-num" style="color:${d.quant.objections === '3/3' ? 'var(--green)' : 'var(--amber)'};">${d.quant.objections}</div><div class="dq-label">Objections traitées</div></div>
                                <div class="dq-item"><div class="dq-num" style="color:${d.quant.suggestions === '7/8' ? 'var(--green)' : 'var(--red)'};">${d.quant.suggestions}</div><div class="dq-label">Suggestions IA suivies</div></div>
                            </div>
                            <div class="debrief-qual" style="border-left-color: ${d.statusColor === 'green' ? 'var(--blue)' : 'var(--red)'};">
                                <strong>Analyse IA :</strong> ${d.qual}
                            </div>
                            <div class="debrief-actions">
                                <button class="replay-btn" data-replay="Moment clé"><svg class="play-icon" viewBox="0 0 12 12" fill="currentColor"><path d="M3 2.5l7 3.5-7 3.5V2.5z"/></svg>Moment clé (0:45)</button>
                                <button class="btn btn-ghost" style="font-size:11px; padding:4px 10px;" data-toast="Séquence injectée dans un parcours.">Injecter dans un parcours</button>
                                <button class="btn btn-ghost" style="font-size:11px; padding:4px 10px;" data-toast="Partage envoyé à l'équipe.">Partager avec l'équipe</button>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
                mainContent.innerHTML = html;
                attachTabEvents();
                attachDataToastEvents();
                attachReplayEvents();
            }

            // ─── EVENT ATTACHMENT HELPERS ─────────────────
            function attachTabEvents() {
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        state.view = btn.dataset.view;
                        render();
                    });
                });
            }

            function attachDataToastEvents() {
                document.querySelectorAll('[data-toast]').forEach(el => {
                    el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        showToast(el.dataset.toast);
                    });
                });
            }

            function attachFilterEvents() {
                document.querySelectorAll('.filter-pill').forEach(pill => {
                    pill.addEventListener('click', () => {
                        state.teamFilter = pill.dataset.filter;
                        renderTeam();
                    });
                });
            }

            function attachRepClickEvents() {
                document.querySelectorAll('tr[data-rep]').forEach(row => {
                    row.addEventListener('click', (e) => {
                        if (e.target.closest('.action-link')) return;
                        const repName = row.dataset.rep;
                        openModal(repName);
                    });
                });
                document.querySelectorAll('.action-link[data-rep]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openModal(btn.dataset.rep);
                    });
                });
            }

            function attachRadarFilterEvents() {
                document.querySelectorAll('.radar-filter').forEach(f => {
                    f.addEventListener('click', () => {
                        state.radarFilter = f.dataset.filter;
                        renderTeam();
                    });
                });
            }

            function attachReplayEvents() {
                document.querySelectorAll('.replay-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        showToast('Lecture du replay : ' + (btn.dataset.replay || 'moment clé'));
                    });
                });
            }

            // ─── MODAL ────────────────────────────────────
            function openModal(repName) {
                const periodData = periods[state.period];
                const rep = periodData.teams.find(r => r.name === repName);
                if (!rep) return;
                state.selectedRep = repName;
                modalTitle.textContent = repName + ' — ' + rep.role;
                modalBody.innerHTML = `
                    <div class="modal-row">
                        <div class="modal-col">
                            <div class="modal-label">Alignement Top Performer</div>
                            <div class="modal-value">${rep.align}%</div>
                        </div>
                        <div class="modal-col">
                            <div class="modal-label">Copilote utilisé</div>
                            <div class="modal-value">${rep.copilote}%</div>
                        </div>
                        <div class="modal-col">
                            <div class="modal-label">Taux de closing</div>
                            <div class="modal-value">${rep.closing}%</div>
                        </div>
                    </div>
                    <div class="modal-row">
                        <div class="modal-col">
                            <div class="modal-label">Delta vs M-1</div>
                            <div class="modal-value">${rep.delta}</div>
                        </div>
                        <div class="modal-col">
                            <div class="modal-label">Statut</div>
                            <div class="modal-value">${rep.status}</div>
                        </div>
                        <div class="modal-col">
                            <div class="modal-label">Dernière simulation</div>
                            <div class="modal-value">Il y a 2 jours</div>
                        </div>
                    </div>
                    <div>
                        <div class="modal-label">Analyse des derniers appels</div>
                        <ul style="font-size:12px; color:var(--text-2); padding-left:16px;">
                            <li>Appel avec le copilote actif : 8 suggestions, 7 suivies</li>
                            <li>Points forts : découverte et objection prix</li>
                            <li>Axe d'amélioration : demande d'engagement</li>
                        </ul>
                    </div>
                    <div style="display:flex; gap:8px;">
                        <button class="btn btn-primary" data-toast="Parcours personnalisé assigné.">Assigner parcours correctif</button>
                        <button class="btn btn-ghost" data-toast="Rapport détaillé exporté.">Exporter le rapport détaillé</button>
                    </div>
                `;
                modalOverlay.classList.add('active');
                attachDataToastEvents(); // reattach for modal buttons
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
                state.selectedRep = null;
            }

            modalClose.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModal();
            });

            // ─── TOAST ─────────────────────────────────────
            function showToast(message) {
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = message;
                toastContainer.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(10px)';
                    toast.style.transition = 'all 0.3s ease';
                    setTimeout(() => toast.remove(), 300);
                }, 2000);
            }

            // ─── PERIOD & SIDEBAR EVENTS ──────────────────
            document.querySelectorAll('.period-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    state.period = tab.dataset.period;
                    render();
                });
            });

            document.querySelectorAll('.sb-icon[data-view]').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.view = btn.dataset.view;
                    render();
                });
            });

            document.getElementById('livePill').addEventListener('click', () => {
                showToast('Vue live (lecture seule) ouverte.');
            });
            document.getElementById('exportBtn').addEventListener('click', () => {
                showToast('Rapport CODIR exporté (PDF simulé).');
            });
            document.getElementById('topPerfBtn').addEventListener('click', () => {
                showToast('Profil des Top Performers affiché.');
            });

            // Initial render
            render();
        })();
    </script>
</body>
</html>
